services:
  # Nginx + PHP-FPM (默认 Web 服务器)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-beikeshop}-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${APP_CODE_PATH:-.}:/app
      - ./docker/nginx/nginx-site.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mysql
      - meilisearch
    networks:
      - beikeshop-network

  # CyberCloak 全量商品映射使用独立队列，避免后台 HTTP 请求被 Cloudflare 等代理超时中断。
  queue:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-beikeshop}-queue
    restart: unless-stopped
    command: php artisan queue:work cyber_cloak --queue=cyber_cloak --timeout=3600 --tries=1 --sleep=3
    volumes:
      - ${APP_CODE_PATH:-.}:/app
    depends_on:
      - mysql
      - meilisearch
    networks:
      - beikeshop-network

  # Meilisearch 商品全文搜索服务，仅在 Compose 内网提供访问。
  meilisearch:
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.37}
    container_name: ${PROJECT_NAME:-beikeshop}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set and contain at least 16 bytes}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
    expose:
      - "7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - beikeshop-network

  # Meilisearch 索引任务 Worker；商品变更和全量重建均使用 meilisearch 队列。
  meilisearch-worker:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-beikeshop}-meilisearch-worker
    restart: unless-stopped
    command: php artisan queue:work --queue=meilisearch,default --sleep=3 --tries=3 --timeout=7200 --memory=256
    volumes:
      - ${APP_CODE_PATH:-.}:/app
    depends_on:
      - mysql
      - meilisearch
    networks:
      - beikeshop-network

  # MySQL 数据库
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: ${PROJECT_NAME:-beikeshop}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-beikeshop}
      MYSQL_USER: ${DB_USER:-beikeshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-beikeshop}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - beikeshop-network
    command: --default-authentication-plugin=mysql_native_password

networks:
  beikeshop-network:
    driver: bridge

volumes:
  mysql-data:
  meilisearch-data:
